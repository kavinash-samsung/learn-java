server:
  port: 9001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/springmicroservices
    username: springuser
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect